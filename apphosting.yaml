# Firebase App Hosting Configuration for Next.js Full-Stack SSR
# Documentation: https://firebase.google.com/docs/app-hosting

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # Site mode: "main" blocks /admin routes, "admin" blocks all non-admin routes
  - variable: SITE_MODE
    value: "main"
    availability:
      - BUILD
      - RUNTIME

