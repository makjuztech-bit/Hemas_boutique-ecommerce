# Firebase App Hosting Configuration — ADMIN PANEL BACKEND
# This backend serves only /admin/* routes.
# Deploy with: firebase apphosting:backends:create --project makjuz-website

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 3
  concurrency: 40

env:
  # Tell middleware this is the admin-only backend
  - variable: SITE_MODE
    value: "admin"
    availability:
      - BUILD
      - RUNTIME

  # ── Shared Firebase config (same project) ──
