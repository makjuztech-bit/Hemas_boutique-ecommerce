# Firebase App Hosting Configuration — ADMIN PANEL BACKEND
# This backend serves only /admin/* routes.
# Deploy with: firebase apphosting:backends:create --project makjuz-website

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 3
  concurrency: 40

env:
  # Tell middleware this is the admin-only backend
  - variable: SITE_MODE
    value: "admin"
    availability:
      - BUILD
      - RUNTIME

  # ── Shared Firebase config (same project) ──
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDQR-3Fdiy4nGSwOFOT8zjvAHXEaBiY5Vg"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "makjuz-website.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "makjuz-website"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
