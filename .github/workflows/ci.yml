name: CI - Build, Test & Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:test@localhost:5432/test?schema=public"
      DIRECT_URL: "postgresql://postgres:test@localhost:5432/test?schema=public"
      AUTH_SECRET: "ci-test-secret-key-32-characters-minimum"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Verify Production Next.js Build
        run: npm run build
